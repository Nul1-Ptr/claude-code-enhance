name: Build VSIX and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install package metadata
        run: npm install --no-audit --no-fund

      - name: Run smoke test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-enhance-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Upload tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v$VERSION"
          RELEASE_TITLE="v$VERSION"
          # Create a real (non-prerelease) release for this version if it doesn't exist yet.
          # Existing releases are reused so re-pushes just refresh the attached VSIX.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --prerelease=false --latest
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --generate-notes --latest --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" ./*.vsix --clobber
